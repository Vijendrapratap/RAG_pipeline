# Stage 3.2 — corpus-grounded golden query set (replaces the fixture-only
# golden_queries.yaml, which measured a mock quarterly-review + CAP essay).
#
# Ground truth is derived from the LIVE corpus, not from retrieval:
#   - entity positives (type=topic, match=any): expected_source_files are the
#     files that literally contain the entity (Postgres ILIKE over chunk_meta).
#     A retrieval hit = surfacing ANY genuinely-relevant file in top-K. This is
#     where the cross-script gap (Stage 0.1 puran-singh failure) shows up.
#   - synthetic quote positives (type=quote): a verbatim line lifted from a real
#     chunk; the pipeline must return that chunk (doc2query, generation-only).
#   - negatives (type=negative): invented people/places/events — the system
#     SHOULD abstain (top reranked score < cite_min_score). Scores abstention.
#   - analytics (type=analytics): Postgres count/list/speaker checks.
#
# पुरन सिंह is a POSITIVE, never a negative (215+ chunks in the corpus).
# Regenerated by scratchpad/build_golden.sh; hand-editable thereafter.

