# Phase F stack. Open WebUI and Redis are gone; the rag-api container
# (FastAPI + the built React dashboard, with Tantivy BM25 in-process)
# now serves the user-facing port 8080. The five remaining services
# (ollama, qdrant, reranker, postgres, rag-api) are everything the
# system needs to answer queries.

services:
  rag-api:
    build:
      context: .
      dockerfile: services/rag_api/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    depends_on: [ollama, qdrant, postgres, reranker]
    # The ONLY service published beyond loopback, and the only one with an auth
    # gate (DASHBOARD_PASSWORD). Every service below is pinned to 127.0.0.1 —
    # see the note on ollama for why that matters.
    ports: ["0.0.0.0:8080:8080"]
    volumes:
      # Tantivy index built by ingestion is read in-process by the API.
      # Read-only because the API is a reader; the ingestion job writes
      # to the same host directory directly.
      - ./data/tantivy:/app/data/tantivy:ro
      # PageIndex section trees, built offline by ingestion.build_pageindex.
      # Read-only for the same reason; without this mount the API sees an
      # empty dir and the pageindex backend returns no results.
      - ./data/pageindex:/app/data/pageindex:ro
      # The archive map's track panel reads two trees that live outside the
      # repo. Host paths come from `.env`; both are strictly read-only, and the
      # API only ever opens a path derived from an existing `file_meta` row.
      #
      # Long syntax on purpose: a Windows source like `D:/x` would be split on
      # its colon by the short `src:dst:mode` form. Prefer a path relative to
      # this file (`../GuruAudio/Output`) over `/mnt/d/...` — see the tantivy
      # note in docker-compose.override.yml for why the latter mounts empty.
      #
      # ISOLATED_DIR is `GuruAudio/Output`, the folder *holding* the per-model
      # `.ckpt` trees, not one of them: three tracks were isolated by the second
      # model and are unreachable from inside a single model's folder.
      - type: bind
        source: ${TRANSCRIPTS_DIR:-./data/empty}
        target: /app/data/transcripts
        read_only: true
      - type: bind
        source: ${ISOLATED_DIR:-./data/empty}
        target: /app/data/isolated
        read_only: true
    environment:
      # --- upstream services (docker DNS) ---
      OLLAMA_URL: "http://ollama:11434"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY}"
      RERANKER_URL: "http://reranker:7997"
      POSTGRES_DSN: "postgresql://owui:${POSTGRES_PASSWORD}@postgres:5432/openwebui"
      # --- retrieval / index location ---
      QDRANT_COLLECTION: "transcripts"
      QDRANT_SUMMARY_COLLECTION: "transcript_summaries"
      TANTIVY_DIR: "/app/data/tantivy"
      EMBED_MODEL: "bge-m3"
      # --- answer model ---
      # CHAT_PROVIDER selects which backend writes the final answer:
      #   "ollama" (default, strictly local) or "openrouter" (opt-in cloud).
      # When openrouter, retrieved chunks leave the host — gated trade-off.
      CHAT_PROVIDER: "${CHAT_PROVIDER:-ollama}"
      # Ollama path — swap to the fine-tuned 26B model here once it is ready.
      CHAT_MODEL: "${CHAT_MODEL:-qwen3.5:9b}"
      CHAT_NUM_CTX: "${CHAT_NUM_CTX:-8192}"
      # Prefill batch size — wider = faster time-to-first-token on large RAG
      # prompts, no effect on output quality. 512 is ollama's default.
      CHAT_NUM_BATCH: "${CHAT_NUM_BATCH:-1024}"
      CHAT_TEMPERATURE: "${CHAT_TEMPERATURE:-0.2}"
      # Anti-repetition penalty (1.0=off) — guards against degenerate loops.
      CHAT_REPEAT_PENALTY: "${CHAT_REPEAT_PENALTY:-1.1}"
      CHAT_TIMEOUT_S: "${CHAT_TIMEOUT_S:-300}"
      # Reasoning toggle: "off" disables the thinking model's hidden <think>
      # chain for much faster replies; "auto" (default) keeps it. See .env.
      CHAT_THINK: "${CHAT_THINK:-auto}"
      # TAG_MODEL: Ollama model for the offline Phase 13 enrichment pass
      # (ingestion.enrich_content_tags). That CLI forces think=false itself.
      TAG_MODEL: "${TAG_MODEL:-qwen3.5:9b}"
      # OpenRouter path — only read when CHAT_PROVIDER=openrouter. Empty key
      # is fine when running in local mode; populate it in `.env` to enable.
      OPENROUTER_URL: "${OPENROUTER_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-qwen/qwen3.6-27b}"
      OPENROUTER_MAX_TOKENS: "${OPENROUTER_MAX_TOKENS:-4096}"
      OPENROUTER_REFERER: "${OPENROUTER_REFERER:-}"
      OPENROUTER_TITLE: "${OPENROUTER_TITLE:-transcript-rag}"
      # --- frontend model dropdown (extras; defaults always added) ---
      AVAILABLE_OLLAMA_MODELS: "${AVAILABLE_OLLAMA_MODELS:-}"
      AVAILABLE_OPENROUTER_MODELS: "${AVAILABLE_OPENROUTER_MODELS:-}"
      # --- retrieval tuning ---
      RAG_CANDIDATES: "${RAG_CANDIDATES:-40}"
      RAG_TOP_K: "${RAG_TOP_K:-4}"
      # Citation floor: only passages reranked above this are cited / shown in
      # the chat and fed to the answer model. 0 disables it. Calibrated to 0.03
      # from the §0.2 histogram (0.75 dropped legit cross-script top hits).
      RAG_CITE_MIN_SCORE: "${RAG_CITE_MIN_SCORE:-0.03}"
      # Abstain (drop the keep-one-passage net) when nothing clears the floor.
      # Default off until §3.2 certifies a floor against a negative set.
      RAG_ALLOW_ABSTAIN: "${RAG_ALLOW_ABSTAIN:-false}"
      RAG_BM25_WEIGHT: "${RAG_BM25_WEIGHT:-0.65}"
      RAG_QUOTE_BM25_WEIGHT: "${RAG_QUOTE_BM25_WEIGHT:-0.85}"
      RAG_SUMMARY_TOP_FILES: "${RAG_SUMMARY_TOP_FILES:-6}"
      # --- Stage 4: query router + conversational follow-up rewriting ---
      # On for the linked (multi-turn) chat feature: the router tags follow-ups
      # and the rewriter turns them into standalone queries using the chat
      # history the dashboard sends. Fires only on detected follow-ups.
      RAG_ROUTER: "${RAG_ROUTER:-1}"
      RAG_FOLLOWUP_REWRITE: "${RAG_FOLLOWUP_REWRITE:-1}"
      RAG_HYDE_THEMATIC: "${RAG_HYDE_THEMATIC:-0}"
      RAG_NAME_BM25_WEIGHT: "${RAG_NAME_BM25_WEIGHT:-0.75}"
      # Agentic planner: list intent ("10 sittings for rain") + bilingual
      # retrieval variants, one think=false chat call per query. Fail-open.
      RAG_PLANNER: "${RAG_PLANNER:-0}"
      RAG_PLANNER_MAX_QUERIES: "${RAG_PLANNER_MAX_QUERIES:-3}"
      RAG_LIST_TOP_K: "${RAG_LIST_TOP_K:-20}"
      # Chitchat answered by the chat model (fallback: fixed reply) and the
      # chunk budget for verbatim-summary turns. 2026-07-15 improvements.
      RAG_CHITCHAT_LLM: "${RAG_CHITCHAT_LLM:-1}"
      RAG_VERBATIM_TOP_K: "${RAG_VERBATIM_TOP_K:-10}"
      # Post-synthesis groundedness judge (drops unsupported answer sentences).
      RAG_GROUNDEDNESS: "${RAG_GROUNDEDNESS:-0}"
      # --- auth + CORS ---
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD}"
      # Same-origin in this container; widen only if you host the UI elsewhere.
      RAG_CORS_ORIGINS: "${RAG_CORS_ORIGINS:-}"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Loopback only: ollama's API is unauthenticated and exposes /api/pull and
    # /api/delete. On 0.0.0.0 it hands anyone on the LAN free generation on this
    # GPU plus the ability to destroy the model store. Do NOT remove the publish
    # outright — desktop/main.js probes localhost:11434 (ollamaHasModels) as its
    # empty-mount detector, and a failed probe makes every launch run
    # `compose up --force-recreate`.
    #
    # Nothing in-cluster needs this mapping: rag-api reaches ollama over the
    # compose network at http://ollama:11434.
    ports: ["127.0.0.1:11434:11434"]
    volumes: [./data/ollama:/root/.ollama]
    environment:
      # -1 keeps the chat model resident in VRAM for the whole session so the
      # first query after a launch is not slow. The desktop shell pre-warms it
      # right after the stack comes up. Plenty of headroom on the RTX 5090.
      OLLAMA_KEEP_ALIVE: "-1"
      # Two parallel slots — allows the embedding and chat model to serve
      # concurrent LAN requests without blocking each other. Each slot gets
      # half the context window; raise back to 1 if you need the full 8k ctx
      # for a single user and latency under load is not a concern.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      # Quantize the KV cache to 8-bit (needs flash attention, set above).
      # Halves KV-cache VRAM with quality indistinguishable from f16, freeing
      # headroom to keep both models resident. q4_0 would be smaller but can
      # dent quality — q8_0 is the quality-neutral choice.
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    # Loopback only. The API key is a second line of defence, not the first —
    # host-side ingestion still reaches this via localhost:6333 (see .env).
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: [./data/qdrant:/qdrant/storage]
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: "4"

  reranker:
    image: michaelf34/infinity:latest
    container_name: reranker
    restart: unless-stopped
    # Loopback only: infinity has no auth of any kind.
    ports: ["127.0.0.1:7997:7997"]
    command: >
      v2
      --model-id BAAI/bge-reranker-v2-m3
      --port 7997
      --engine torch
      --batch-size 32
    volumes: [./data/infinity-cache:/app/.cache]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: openwebui
    volumes: [./data/postgres:/var/lib/postgresql/data]
    # Loopback only. Host-side analytics/ingestion reach this via localhost:5432.
    ports: ["127.0.0.1:5432:5432"]
