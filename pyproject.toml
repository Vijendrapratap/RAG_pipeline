[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-rag"
version = "0.1.0"
description = "Local-only, open-source RAG over ~5 TB of Whisper-generated transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9",
    "tantivy>=0.21",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "psutil>=5.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
# Tantivy runs in-process inside rag_api (the old :8765 sidecar was
# retired in Phase F and removed from the tree). The legacy
# open_webui_functions package and its eval/run_eval.py harness were
# removed in the post-Phase-F cleanup — the deployed stack never imported them.
include = ["ingestion*", "eval*", "rag_api*"]
exclude = ["tests*", "data*", "dead_letter*"]
